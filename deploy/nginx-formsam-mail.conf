# formsam — nginx vor dem Mailserver Stalwart (nur Produktivserver). Liegt unter /etc/nginx/sites-available/formsam-mail.
# nginx macht HTTPS für die Web-Dienste von Stalwart (Admin, Webmail, JMAP, Autokonfiguration, MTA-STS) und reicht sie an den
# internen HTTP-Listener 127.0.0.1:8080 weiter. Die Mail-Ports (25, 465, 587, 993) bedient Stalwart direkt, ohne nginx.
# Zertifikat: certbot, Name mx.formsam.com (Deploy-Hook deploy/stalwart-zertifikat.sh gibt es auch Stalwart).

map $http_upgrade $mail_connection_upgrade {
    default upgrade;
    ''      close;
}

# http → https (ACME-Prüfungen beantwortet certbot selbst)
server {
    listen 80;
    listen [::]:80;
    server_name mx.formsam.com webmail.formsam.com autodiscover.formsam.com mta-sts.formsam.com;
    location / { return 301 https://$host$request_uri; }
}

# Webmail unter einer leicht merkbaren Adresse → Bulwark auf dem Mail-Host
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name webmail.formsam.com;
    ssl_certificate /etc/letsencrypt/live/mx.formsam.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mx.formsam.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    location / { return 301 https://mx.formsam.com/webmail/; }
}

# Mail-Host, Autokonfiguration (Outlook) und MTA-STS-Richtlinie → Stalwart
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mx.formsam.com autodiscover.formsam.com mta-sts.formsam.com;
    ssl_certificate /etc/letsencrypt/live/mx.formsam.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mx.formsam.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Anhänge über JMAP/Webmail
    client_max_body_size 75m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Stalwart nimmt die Besucher-IP aus X-Forwarded-For (Http.clientIpSource) – wichtig für Sperren und Rate-Limits.
    # Bewusst $remote_addr statt Anhängen: ein mitgeschickter X-Forwarded-For-Kopf des Besuchers zählt nicht.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # JMAP-Push (WebSocket und EventSource) offen halten
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $mail_connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 300s;
    proxy_request_buffering off;

    # Hochgeladene Dateien und Anhänge laufen auf derselben Adresse wie die Webmail: nie als Seite ausführen
    # (Empfehlung aus dem Bulwark-Lite-README)
    location ~ ^/(dav|jmap/download)/ {
        proxy_pass http://127.0.0.1:8080;
        add_header Content-Security-Policy "sandbox" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /webmail/ {
        proxy_pass http://127.0.0.1:8080;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
    }
}
