# formsam — Systemprotokoll (Meldungen von Shop und Mailserver, beide schreiben ins Journal) nach 14 Tagen löschen, wie in der
# Datenschutzerklärung zugesagt. Einspielen (root):
#   install -D -m 644 /srv/formsam/deploy/journald-formsam.conf /etc/systemd/journald.conf.d/formsam.conf
#   systemctl restart systemd-journald && journalctl --vacuum-time=14d
[Journal]
# Einträge höchstens 14 Tage aufbewahren; Journal-Dateien täglich wechseln — sonst sammelt eine Datei bis zu einem Monat,
# und die Frist greift erst, wenn alle Einträge darin alt genug sind
MaxRetentionSec=14day
MaxFileSec=1day
