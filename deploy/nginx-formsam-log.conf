# formsam — nginx-Zugriffsprotokoll ohne Query-String: Beleg-Links tragen den geheimen Schlüssel (?k=…), Passwort- und
# Bestätigungslinks ein Token (?reset=…, ?verify=…) — beides gehört nicht ins Protokoll. Gilt auch für den Referer.
# Liegt unter /etc/nginx/conf.d/formsam-log.conf (Debian/Ubuntu laden conf.d vor den Sites). Die Sites schreiben damit nach
# /var/log/nginx/formsam/ (access_log … formsam; in nginx-formsam.conf und nginx-formsam-mail.conf); logrotate-Regel:
# deploy/logrotate-formsam-nginx (14 Tage). Einspielen: README „Protokolle und Sicherungen“.
map $request_uri $formsam_log_pfad {
    "~^(?<formsam_pfad>[^?]*)\?"  "${formsam_pfad}?***";
    default                       $request_uri;
}
map $http_referer $formsam_log_referer {
    ""                            "-";
    "~^(?<formsam_ref>[^?]*)\?"   "${formsam_ref}?***";
    default                       $http_referer;
}
log_format formsam '$remote_addr - $remote_user [$time_local] "$request_method $formsam_log_pfad $server_protocol" '
                   '$status $body_bytes_sent "$formsam_log_referer" "$http_user_agent"';
