# formsam — nginx vor dem Shop (Produktivserver). Liegt unter /etc/nginx/sites-available/formsam.
# HTTPS-Zertifikat und die Weiterleitung http → https trägt certbot (Let's Encrypt) selbst ein.
#
# HTTP/2 (viele kleine Dateien — JS-Module, CSS — über eine Verbindung statt sechs): certbot schreibt in diesen Block
# „listen 443 ssl; # managed by Certbot“ und „listen [::]:443 ssl ipv6only=on; # managed by Certbot“. Beide Zeilen danach
# einmal von Hand um http2 ergänzen. Ubuntu 24.04 liefert nginx 1.24 — dort gehört http2 in die listen-Zeile:
#     listen 443 ssl http2; # managed by Certbot
#     listen [::]:443 ssl http2 ipv6only=on; # managed by Certbot
# (Ab nginx 1.25.1 stattdessen eine eigene Zeile „http2 on;“ — mit 1.24 scheitert nginx -t daran.) http2 gilt dann für alle
# server-Blöcke auf Port 443, also auch für formsam-mail. Danach: nginx -t && systemctl reload nginx;
# prüfen mit curl -sI --http2 https://www.formsam.com/ | head -1  → „HTTP/2 200“.
# Komprimiert wird im Shop selbst (gzip/Brotli, server.js gepackt()) — kein gzip in nginx nötig.
# Optional (eine Weiterleitung weniger): im von certbot angelegten Port-80-Block für beide Namen direkt
#     return 301 https://www.formsam.com$request_uri;
# statt „https://$host…“ — dann geht http://formsam.com in einem Schritt auf https://www.formsam.com.
server {
    listen 80;
    listen [::]:80;
    server_name www.formsam.com formsam.com;

    # Zugriffsprotokoll ohne Query-String (Beleg-Schlüssel ?k=…), 14 Tage — Format aus nginx-formsam-log.conf (conf.d)
    access_log /var/log/nginx/formsam/access.log formsam;

    # Druckdateien (STL/3MF, je Modell höchstens 190 MB laut server.js MAX_STL) gehen beim Bestellen hoch
    client_max_body_size 200m;   # größte Druckdatei 126,5 MB + 50 % (server.js MAX_STL = 190 MB)

    # HSTS: nur im HTTPS-Block (certbot ergänzt dort listen 443 ssl); Browser bleiben ein Jahr bei https — ohne includeSubDomains,
    # damit Subdomains (z. B. mx.formsam.com) unabhängig bleiben. Die übrigen Schutz-Kopfzeilen setzt der Shop selbst (server.js).
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        # formsam.com ohne www → www.formsam.com (eine Adresse für Links, Cookies und Suchmaschinen)
        if ($host = formsam.com) { return 301 https://www.formsam.com$request_uri; }
        proxy_pass http://127.0.0.1:4488;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;   # große Uploads direkt durchreichen
    }
}
